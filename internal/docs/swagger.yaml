    type: string
    x-enum-varnames:
    - TaxRateTaxTypeAmusementTax
    - TaxRateTaxTypeCommunicationsTax
    - TaxRateTaxTypeGST
    - TaxRateTaxTypeHST
    - TaxRateTaxTypeIGST
    - TaxRateTaxTypeJCT
    - TaxRateTaxTypeLeaseTax
    - TaxRateTaxTypePST
    - TaxRateTaxTypeQST
    - TaxRateTaxTypeRST
    - TaxRateTaxTypeSalesTax
    - TaxRateTaxTypeServiceTax
    - TaxRateTaxTypeVAT
  stripe.TestHelpersTestClock:
    properties:
      created:
        description: Time at which the object was created. Measured in seconds since
          the Unix epoch.
        type: integer
      deleted:
        type: boolean
      deletes_after:
        description: Time at which this clock is scheduled to auto delete.
        type: integer
      frozen_time:
        description: Time at which all objects belonging to this clock are frozen.
        type: integer
      id:
        description: Unique identifier for the object.
        type: string
      livemode:
        description: Has the value `true` if the object exists in live mode or the
          value `false` if the object exists in test mode.
        type: boolean
      name:
        description: The custom name supplied at creation.
        type: string
      object:
        description: String representing the object's type. Objects of the same type
          share the same value.
        type: string
      status:
        allOf:
        - $ref: '#/definitions/stripe.TestHelpersTestClockStatus'
        description: The status of the Test Clock.
    type: object
  stripe.TestHelpersTestClockStatus:
    enum:
    - advancing
    - internal_failure
    - ready
    type: string
    x-enum-varnames:
    - TestHelpersTestClockStatusAdvancing
    - TestHelpersTestClockStatusInternalFailure
    - TestHelpersTestClockStatusReady
  stripe.Transfer:
    properties:
      amount:
        description: Amount in cents (or local equivalent) to be transferred.
        type: integer
      amount_reversed:
        description: Amount in cents (or local equivalent) reversed (can be less than
          the amount attribute on the transfer if a partial reversal was issued).
        type: integer
      balance_transaction:
        allOf:
        - $ref: '#/definitions/stripe.BalanceTransaction'
        description: Balance transaction that describes the impact of this transfer
          on your account balance.
      created:
        description: Time that this record of the transfer was first created.
        type: integer
      currency:
        allOf:
        - $ref: '#/definitions/stripe.Currency'
        description: Three-letter [ISO currency code](https://www.iso.org/iso-4217-currency-codes.html),
          in lowercase. Must be a [supported currency](https://stripe.com/docs/currencies).
      description:
        description: An arbitrary string attached to the object. Often useful for
          displaying to users.
        type: string
      destination:
        allOf:
        - $ref: '#/definitions/stripe.Account'
        description: ID of the Stripe account the transfer was sent to.
      destination_payment:
        allOf:
        - $ref: '#/definitions/stripe.Charge'
        description: If the destination is a Stripe account, this will be the ID of
          the payment that the destination account received for the transfer.
      id:
        description: Unique identifier for the object.
        type: string
      livemode:
        description: Has the value `true` if the object exists in live mode or the
          value `false` if the object exists in test mode.
        type: boolean
      metadata:
        additionalProperties:
          type: string
        description: Set of [key-value pairs](https://stripe.com/docs/api/metadata)
          that you can attach to an object. This can be useful for storing additional
          information about the object in a structured format.
        type: object
      object:
        description: String representing the object's type. Objects of the same type
          share the same value.
        type: string
      reversals:
        allOf:
        - $ref: '#/definitions/stripe.TransferReversalList'
        description: A list of reversals that have been applied to the transfer.
      reversed:
        description: Whether the transfer has been fully reversed. If the transfer
          is only partially reversed, this attribute will still be false.
        type: boolean
      source_transaction:
        allOf:
        - $ref: '#/definitions/stripe.Charge'
        description: ID of the charge or payment that was used to fund the transfer.
          If null, the transfer was funded from the available balance.
      source_type:
        allOf:
        - $ref: '#/definitions/stripe.TransferSourceType'
        description: The source balance this transfer came from. One of `card`, `fpx`,
          or `bank_account`.
      transfer_group:
        description: A string that identifies this transaction as part of a group.
          See the [Connect documentation](https://stripe.com/docs/connect/separate-charges-and-transfers#transfer-options)
          for details.
        type: string
    type: object
  stripe.TransferReversal:
    properties:
      amount:
        description: Amount, in cents (or local equivalent).
        type: integer
      balance_transaction:
        allOf:
        - $ref: '#/definitions/stripe.BalanceTransaction'
        description: Balance transaction that describes the impact on your account
          balance.
      created:
        description: Time at which the object was created. Measured in seconds since
          the Unix epoch.
        type: integer
      currency:
        allOf:
        - $ref: '#/definitions/stripe.Currency'
        description: Three-letter [ISO currency code](https://www.iso.org/iso-4217-currency-codes.html),
          in lowercase. Must be a [supported currency](https://stripe.com/docs/currencies).
      destination_payment_refund:
        allOf:
        - $ref: '#/definitions/stripe.Refund'
        description: Linked payment refund for the transfer reversal.
      id:
        description: Unique identifier for the object.
        type: string
      metadata:
        additionalProperties:
          type: string
        description: Set of [key-value pairs](https://stripe.com/docs/api/metadata)
          that you can attach to an object. This can be useful for storing additional
          information about the object in a structured format.
        type: object
      object:
        description: String representing the object's type. Objects of the same type
          share the same value.
        type: string
      source_refund:
        allOf:
        - $ref: '#/definitions/stripe.Refund'
        description: ID of the refund responsible for the transfer reversal.
      transfer:
        allOf:
        - $ref: '#/definitions/stripe.Transfer'
        description: ID of the transfer that was reversed.
    type: object
  stripe.TransferReversalList:
    properties:
      data:
        items:
          $ref: '#/definitions/stripe.TransferReversal'
        type: array
      has_more:
        type: boolean
      total_count:
        description: |-
          TotalCount is the total number of objects in the collection (beyond just
          on the current page). This is not returned in most list calls.

          Deprecated: TotalCount is only included in some legacy situations and
          not generally available anymore.
        type: integer
      url:
        type: string
    type: object
  stripe.TransferSourceType:
    enum:
    - bank_account
    - card
    - fpx
    type: string
    x-enum-varnames:
    - TransferSourceTypeBankAccount
    - TransferSourceTypeCard
    - TransferSourceTypeFPX
host: localhost:8081
info:
  contact: {}
  description: API for ACH payments with Plaid + Stripe orchestrated via Temporal.
  title: Payments Service API
  version: "1.0"
paths:
  /payments:
    get:
      description: Returns all payment records for debugging/admin purposes
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Payment'
            type: array
        "500":
          description: Failed to retrieve payments / encode response
          schema:
            type: string
      summary: List all payments
      tags:
      - payments
    post:
      consumes:
      - application/json
      description: Starts a Temporal workflow to process an ACH payment using the
        provided Stripe customer + payment method.
      parameters:
      - description: Payment request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.CreatePaymentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: workflow_id, run_id, status
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid request payload / Missing or invalid fields
          schema:
            type: string
        "500":
          description: Failed to start payment workflow
          schema:
            type: string
      summary: Start a payment workflow
      tags:
      - payments
  /payments/{id}:
    get:
      description: Returns a single payment record by its ID
      parameters:
      - description: Payment ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Payment'
        "400":
          description: Missing payment ID
          schema:
            type: string
        "404":
          description: Payment not found
          schema:
            type: string
        "500":
          description: Failed to fetch payment
          schema:
            type: string
      summary: Get payment by ID
      tags:
      - payments
  /plaid/account/{id}:
    delete:
      description: Removes a stored Plaid token for a given user ID
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Missing user ID
          schema:
            type: string
        "500":
          description: Failed to delete Plaid token
          schema:
            type: string
      summary: Delete Plaid account
      tags:
      - plaid
  /plaid/accounts:
    get:
      consumes:
      - application/json
      description: Returns the user's linked Plaid account. Use `with_balance=true`
        to include current/available balance.
      parameters:
      - description: User ID whose Plaid account to fetch
        in: query
        name: user_id
        required: true
        type: string
      - description: If true, returns account with balance
        in: query
        name: with_balance
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/plaid.AccountWithBalance'
            type: array
        "400":
          description: missing user_id
          schema:
            type: string
        "404":
          description: user has no linked account
          schema:
            type: string
        "500":
          description: plaid error
          schema:
            type: string
      summary: Get user's linked Plaid account
      tags:
      - plaid
  /plaid/exchange-token:
    post:
      consumes:
      - application/json
      description: Exchanges a Plaid public token for an access token, stores it,
        and links it to the user
      parameters:
      - description: Public token exchange request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.ExchangeTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid request
          schema:
            type: string
        "500":
          description: Failed to exchange or save token
          schema:
            type: string
      summary: Exchange Plaid Public Token
      tags:
      - plaid
  /plaid/link-token:
    post:
      consumes:
      - application/json
      description: Generates a new Plaid Link Token for the given user ID
      parameters:
      - description: User ID request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateLinkTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid request
          schema:
            type: string
        "500":
          description: Failed to create link token
          schema:
            type: string
      summary: Create Plaid Link Token
      tags:
      - plaid
  /plaid/processor-token:
    post:
      consumes:
      - application/json
      description: Looks up the user's stored Plaid access/account IDs and creates
        a Stripe processor bank token (btok_…)
      parameters:
      - description: User ID payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateProcessorTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 'keys: stripe_bank_account_token'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: 'Invalid request: missing user_id'
          schema:
            type: string
        "404":
          description: Failed to get Plaid token
          schema:
            type: string
        "500":
          description: Failed to create Stripe token
          schema:
            type: string
      summary: Create Stripe bank-account token from Plaid data
      tags:
      - plaid
  /stripe/payment-methods:
    get:
      description: Retrieves Stripe payment methods for a given customer ID, filtered
        by type (e.g., us_bank_account)
      parameters:
      - description: Stripe Customer ID
        in: query
        name: customer_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/stripe.PaymentMethod'
            type: array
        "400":
          description: 'Missing required query parameter: customer_id'
          schema:
            type: string
        "500":
          description: Failed to retrieve payment methods
          schema:
            type: string
      summary: List Stripe payment methods
      tags:
      - stripe
    post:
      consumes:
      - application/json
      description: Creates a Stripe payment method from a Plaid processor token and
        attaches it to a Stripe customer
      parameters:
      - description: Customer ID and Processor Token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.CreatePaymentMethodRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/stripe.PaymentMethod'
        "400":
          description: Invalid request body
          schema:
            type: string
        "500":
          description: Stripe payment method creation failed
          schema:
            type: string
      summary: Create Stripe payment method
      tags:
      - stripe
  /stripe/payment-methods/{payment_method_id}:
    delete:
      description: Deletes a Stripe payment method by its ID
      parameters:
      - description: Stripe Payment Method ID
        in: path
        name: payment_method_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Missing payment_method_id
          schema:
            type: string
        "500":
          description: Failed to delete Stripe payment method
          schema:
            type: string
      summary: Delete Stripe payment method
      tags:
      - stripe
  /webhook/plaid:
    post:
      consumes:
      - application/json
      description: Receives Plaid webhook events (e.g., TRANSACTIONS_UPDATED) and
        triggers internal updates
      parameters:
      - description: Plaid webhook payload
        in: body
        name: payload
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Invalid Plaid webhook payload
          schema:
            type: string
      summary: Plaid webhook receiver
      tags:
      - webhooks
  /webhook/stripe:
    post:
      consumes:
      - application/json
      description: Receives Stripe webhook events (e.g., charge.succeeded/failed)
        and updates payment status
      parameters:
      - description: Stripe signature header for webhook verification
        in: header
        name: Stripe-Signature
        type: string
      - description: Stripe event payload
        in: body
        name: payload
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Invalid Stripe webhook payload
          schema:
            type: string
        "503":
          description: Error reading webhook request
          schema:
            type: string
      summary: Stripe webhook receiver
      tags:
      - webhooks
schemes:
- http
swagger: "2.0"
